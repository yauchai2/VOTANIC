<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votanic Prototypes</title>
<style>
:root{--bg:#0e0d0d;--card:#1d1d1d;--line:#353535;--text:#e5e5e5;--muted:#a0a0a0;--accent:#d9b0fd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Roboto,Inter,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:64px 16px}
h1{font-size:28px;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 32px}
a.item,div.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px;color:inherit;text-decoration:none}
a.item:hover,a.item:focus-visible{border-color:var(--accent);outline:none}
.t{font-weight:600}.d{color:var(--muted);font-size:14px}.p{color:var(--accent);font-size:13px;margin-top:4px}
div.item{opacity:.6}
</style>
</head>
<body>
<main>
<h1>Votanic Prototypes</h1>
<p class="sub">Interactive web prototypes. One link per feature.</p>
<a class="item" href="/remote-trigger/"><div class="t">Remote Trigger</div><div class="d">XRCC editor, Play and phone remote</div><div class="p">/remote-trigger</div></a>
<a class="item" href="/ai-provider/"><div class="t">AI Provider</div><div class="d">Providers, keys, voices and sessions in XRCC</div><div class="p">/ai-provider</div></a>
<div class="item"><div class="t">Voyage 360</div><div class="d">Loading Enhancement. In progress, coming soon.</div></div>
</main>
</body>
</html>
