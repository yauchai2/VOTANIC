<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabs, pills, tags, badges</title>
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../ui_kits/xrcc-pc/xrcc-ui.css">
<style>body{padding:var(--spacing-24);background:var(--surface-canvas)}h2{font:var(--text-heading-sm);margin:0 0 var(--spacing-16)}.sub{font:var(--text-body-sm);color:var(--text-subtle);margin:var(--spacing-4) 0 var(--spacing-16)}
.row{display:flex;flex-wrap:wrap;gap:var(--spacing-16);align-items:center}.sw{width:152px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-faded)}.sw b{display:block;font:var(--text-body-sm);font-weight:500;margin-top:var(--spacing-8)}.sw span{font:var(--text-caption);color:var(--text-subtle)}
.stack{display:flex;flex-direction:column;gap:var(--spacing-16)}.lbl{font:var(--text-caption);color:var(--text-subtle);text-transform:uppercase;margin-bottom:var(--spacing-8)}</style></head><body>
<script src="../ui_kits/xrcc-pc/icons.js"></script>
<div class="stack"><div class="xr-tabs" style="max-width:480px"><button class="xr-tab on">Debug items</button><button class="xr-tab">Log</button><button class="xr-tab warn"><svg class="xr-i s20"><use href="#i-warning"/></svg>Warnings</button></div><div class="row"><button class="xr-pill on">All 8</button><button class="xr-pill">Watch 5</button><button class="xr-pill">Log 5</button></div><div class="row"><span class="xr-tag">Accent</span><span class="xr-tag outline">Outline</span><span class="xr-tag subtle">Subtle</span><span class="xr-tag danger">Danger</span></div><div class="row"><span class="xr-badge success">Saved locally</span><span class="xr-badge warning">Needs update</span><span class="xr-badge error">Failed</span><span class="xr-badge neutral">Queued</span><span class="xr-badge primary">New</span></div></div>
</body></html>
