<style>body{padding:var(--spacing-24);background:var(--surface-canvas)}h2{font:var(--text-heading-sm);margin:0 0 var(--spacing-16)}.sub{font:var(--text-body-sm);color:var(--text-subtle);margin:var(--spacing-4) 0 var(--spacing-16)}
