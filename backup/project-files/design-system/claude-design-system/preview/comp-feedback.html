<!doctype html>
<!-- @dsCard group="Components" -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alert, toast, tooltip</title>
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../ui_kits/xrcc-pc/xrcc-ui.css">
<style>body{padding:var(--spacing-24);background:var(--surface-canvas)}h2{font:var(--text-heading-sm);margin:0 0 var(--spacing-16)}.sub{font:var(--text-body-sm);color:var(--text-subtle);margin:var(--spacing-4) 0 var(--spacing-16)}
.row{display:flex;flex-wrap:wrap;gap:var(--spacing-16);align-items:center}.sw{width:152px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-faded)}.sw b{display:block;font:var(--text-body-sm);font-weight:500;margin-top:var(--spacing-8)}.sw span{font:var(--text-caption);color:var(--text-subtle)}
.stack{display:flex;flex-direction:column;gap:var(--spacing-16)}.lbl{font:var(--text-caption);color:var(--text-subtle);text-transform:uppercase;margin-bottom:var(--spacing-8)}</style></head><body>
<script src="../ui_kits/xrcc-pc/icons.js"></script>
<div class="stack" style="max-width:520px"><div class="xr-alert"><svg class="xr-i"><use href="#i-warning"/></svg><span>This project uses 2 premium items. They will be locked until your licence is renewed.</span><span class="act">Renew</span></div><div class="xr-alert error"><svg class="xr-i"><use href="#i-warning"/></svg><span>Import failed. 2 files are over the 200 MB limit.</span></div><div class="xr-toast"><svg class="xr-i" style="color:var(--status-success-icon)"><use href="#i-check-circle"/></svg><span>Project saved</span><svg class="xr-i s20" style="margin-left:auto"><use href="#i-close"/></svg></div><div><span class="xr-tip">Locate in scene</span></div><p class="sub">Toast: top-centre, Citrus underline is the progress. Tooltip: default top, gap 8, max 320, fade 100 to 150 ms.</p></div>
</body></html>
