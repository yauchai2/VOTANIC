<!doctype html>
<!-- @dsCard group="Spacing" -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spacing, radius, elevation</title>
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="../ui_kits/xrcc-pc/xrcc-ui.css">
<style>body{padding:var(--spacing-24);background:var(--surface-canvas)}h2{font:var(--text-heading-sm);margin:0 0 var(--spacing-16)}.sub{font:var(--text-body-sm);color:var(--text-subtle);margin:var(--spacing-4) 0 var(--spacing-16)}
.row{display:flex;flex-wrap:wrap;gap:var(--spacing-16);align-items:center}.sw{width:152px}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-faded)}.sw b{display:block;font:var(--text-body-sm);font-weight:500;margin-top:var(--spacing-8)}.sw span{font:var(--text-caption);color:var(--text-subtle)}
.stack{display:flex;flex-direction:column;gap:var(--spacing-16)}.lbl{font:var(--text-caption);color:var(--text-subtle);text-transform:uppercase;margin-bottom:var(--spacing-8)}</style></head><body>
<script src="../ui_kits/xrcc-pc/icons.js"></script>
<h2>Spacing (4px base)</h2><div class="row" style="align-items:flex-end"><div style="text-align:center"><div style="width:4px;height:4px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">4</span></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">8</span></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">12</span></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">16</span></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">20</span></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">24</span></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">32</span></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">40</span></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">48</span></div><div style="text-align:center"><div style="width:56px;height:56px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">56</span></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">64</span></div><div style="text-align:center"><div style="width:72px;height:72px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">72</span></div><div style="text-align:center"><div style="width:80px;height:80px;background:var(--selection-bg);border:1px solid var(--border-interactive)"></div><span class="t-caption" style="color:var(--text-subtle)">80</span></div></div><h2 style="margin-top:32px">Radius</h2><div class="row"><div style="text-align:center"><div style="width:56px;height:56px;background:var(--surface-header);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><span class="t-caption" style="color:var(--text-subtle)">sm 4</span></div><div style="text-align:center"><div style="width:56px;height:56px;background:var(--surface-header);border:1px solid var(--border-default);border-radius:var(--radius-md)"></div><span class="t-caption" style="color:var(--text-subtle)">md 8</span></div><div style="text-align:center"><div style="width:56px;height:56px;background:var(--surface-header);border:1px solid var(--border-default);border-radius:var(--radius-lg)"></div><span class="t-caption" style="color:var(--text-subtle)">lg 16</span></div><div style="text-align:center"><div style="width:56px;height:56px;background:var(--surface-header);border:1px solid var(--border-default);border-radius:var(--radius-xl)"></div><span class="t-caption" style="color:var(--text-subtle)">xl 20</span></div><div style="text-align:center"><div style="width:56px;height:56px;background:var(--surface-header);border:1px solid var(--border-default);border-radius:var(--radius-2xl)"></div><span class="t-caption" style="color:var(--text-subtle)">2xl 24</span></div><div style="text-align:center"><div style="width:56px;height:56px;background:var(--surface-header);border:1px solid var(--border-default);border-radius:var(--radius-full)"></div><span class="t-caption" style="color:var(--text-subtle)">full ∞</span></div></div><p class="sub">md 8 for controls, lg 16 for dialogs and cards, sm 4 for tags and compact bits, notification 10.</p><h2 style="margin-top:32px">Elevation</h2><div class="row"><div style="width:96px;height:64px;border-radius:8px;background:var(--surface-elevated);box-shadow:var(--shadow-1);display:flex;align-items:center;justify-content:center" class="t-caption">shadow 1</div><div style="width:96px;height:64px;border-radius:8px;background:var(--surface-elevated);box-shadow:var(--shadow-2);display:flex;align-items:center;justify-content:center" class="t-caption">shadow 2</div><div style="width:96px;height:64px;border-radius:8px;background:var(--surface-elevated);box-shadow:var(--shadow-3);display:flex;align-items:center;justify-content:center" class="t-caption">shadow 3</div><div style="width:96px;height:64px;border-radius:8px;background:var(--surface-elevated);box-shadow:var(--shadow-4);display:flex;align-items:center;justify-content:center" class="t-caption">shadow 4</div><div style="width:96px;height:64px;border-radius:8px;background:var(--surface-elevated);box-shadow:var(--shadow-5);display:flex;align-items:center;justify-content:center" class="t-caption">shadow 5</div></div>
</body></html>
