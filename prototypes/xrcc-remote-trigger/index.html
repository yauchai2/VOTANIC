:root{
  /* XRCC PC Library, Dark mode. See library-token-map.json for source names. */
  --xrcc-surface-canvas:#1e1e21;
  --xrcc-surface-panel:#161616;
  --xrcc-surface-header:#2a2531;
  --xrcc-surface-elevated:#353535;
  --xrcc-surface-accent-muted:#5f4b8b;
  --xrcc-surface-row-hover:#2a2531;
  --xrcc-action-primary-bg:#392e52;
  --xrcc-action-primary-pressed:#4b387d;
  --xrcc-action-primary-content:#b89afa;
  --xrcc-action-destructive-bg:#a32929;
  --xrcc-selection-bg:#392e52;
  --xrcc-text-primary:#e5e5e5;
  --xrcc-text-secondary:#c8c8c8;
  --xrcc-text-subtle:#818181;
  --xrcc-text-accent:#b89afa;
  --xrcc-text-error:#ff453a;
  --xrcc-border-default:#545454;
  --xrcc-border-subtle:#676767;
  --xrcc-border-disabled:#353535;
  --xrcc-border-interactive:#b89afa;
  --xrcc-border-error:#ff453a;
  --xrcc-status-ok:#37954b;
  --xrcc-status-warn:#c7843a;
  --xrcc-status-error:#a32929;
  --xrcc-yellow-100:#f9ac2f;
  --xrcc-project-variable:#8f7509;
  --xrcc-spacing-2:2px;
  --xrcc-spacing-4:4px;
  --xrcc-spacing-8:8px;
  --xrcc-spacing-12:12px;
  --xrcc-spacing-16:16px;
  --xrcc-spacing-20:20px;
  --xrcc-spacing-24:24px;
  --xrcc-spacing-28:28px;
  --xrcc-spacing-32:32px;
  --xrcc-spacing-36:36px;
  --xrcc-spacing-40:40px;
  --xrcc-spacing-48:48px;
  --xrcc-radius-xs:2px;
  --xrcc-radius-sm:4px;
  --xrcc-radius-md:8px;
  --xrcc-radius-lg:16px;
  --xrcc-radius-2xl:24px;
  --xrcc-radius-3xl:32px;
  --font:Roboto,"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --xrcc-body-lg:400 16px/24px var(--font);
  --xrcc-body-lg-bold:700 16px/24px var(--font);
  --xrcc-body-md:400 14px/20px var(--font);
  --xrcc-body-md-bold:700 14px/20px var(--font);
  --xrcc-body-sm:400 12px/18px var(--font);
  --xrcc-caption:400 11px/16px var(--font);
  --canvas:var(--xrcc-surface-canvas);--panel:var(--xrcc-surface-panel);--header:var(--xrcc-surface-header);--elev:var(--xrcc-surface-elevated);--faded:var(--xrcc-surface-row-hover);
  --sel:var(--xrcc-selection-bg);--sel2:var(--xrcc-action-primary-pressed);--grp:var(--xrcc-surface-header);--primary:var(--xrcc-action-primary-bg);--accent:var(--xrcc-text-accent);
  --interactive:var(--xrcc-border-interactive);--del:var(--xrcc-action-destructive-bg);--text:var(--xrcc-text-primary);--text2:var(--xrcc-text-secondary);--text3:var(--xrcc-text-subtle);
  --border:var(--xrcc-border-default);--subtle:var(--xrcc-border-subtle);--ok:var(--xrcc-status-ok);--warn:var(--xrcc-status-warn);--err:var(--xrcc-text-error);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#141416;color:var(--text);font:14px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}button{cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--text2)}
.top{display:flex;align-items:center;gap:var(--xrcc-spacing-12);padding:var(--xrcc-spacing-8) var(--xrcc-spacing-16);background:var(--header);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top b{font-size:15px}
.tabs{display:flex;gap:var(--xrcc-spacing-4);margin-left:auto;flex-wrap:wrap}
.tab{background:none;border:0;padding:var(--xrcc-spacing-8) 14px;border-radius:6px;color:var(--text2)}
.tab[aria-selected=true]{background:var(--sel);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:var(--xrcc-spacing-2) 10px;font-size:12px;color:var(--text);white-space:nowrap;line-height:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--text3)}.dot.warn{background:var(--warn)}
.wrap{padding:var(--xrcc-spacing-16);max-width:1952px;margin:0 auto}
.dev{display:flex;gap:var(--xrcc-spacing-8);flex-wrap:wrap;margin-top:12px;align-items:center}.dev span{font-size:12px;color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;border:1px solid transparent;background:none;white-space:nowrap}
.btn.pri{background:var(--sel);color:var(--accent)}.btn.sec{border-color:var(--interactive);color:var(--accent)}.btn.ter{border-color:var(--border);color:var(--text)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}.btn.wide{width:100%;height:40px}
.btn:hover:not(:disabled){filter:brightness(1.2)}.btn:disabled{opacity:.4;cursor:not-allowed}
.ib{width:32px;height:32px;border-radius:6px;border:0;background:none;display:grid;place-items:center;color:var(--text);flex:none}
.ib:hover:not(:disabled){background:var(--faded)}.ib:disabled{opacity:.35;cursor:not-allowed}.ib.on{background:var(--sel);color:var(--accent)}
.ib.tint{background:var(--sel);color:var(--accent)}.ib.del{background:var(--del);color:#fff}.ib.tint svg,.ib.del svg{width:16px;height:16px}
.xstage{position:relative;background:#17171b;border:1px solid var(--subtle);border-radius:var(--xrcc-radius-md);min-height:1080px;overflow:hidden}
.xhdr{display:flex;flex-direction:column}
.xm{height:36px;background:#242128;display:flex;align-items:center;gap:var(--xrcc-spacing-20);padding:0 var(--xrcc-spacing-12);font-size:13px;color:var(--text)}
.xm .lg{display:flex;align-items:center;gap:var(--xrcc-spacing-12)}.xm .lg i{width:1px;height:16px;background:var(--border)}
.xm .wc{margin-left:auto;display:flex;gap:var(--xrcc-spacing-28);color:var(--text3)}.xm .wc svg{width:14px;height:14px}
.xbar{height:53px;background:#1a1a1b;display:flex;align-items:center;gap:var(--xrcc-spacing-16);padding:0 var(--xrcc-spacing-16) 0 var(--xrcc-spacing-20);font-size:13px}
.xbar .pj{display:flex;align-items:center;gap:var(--xrcc-spacing-12);color:var(--text2);width:252px;flex:none}.xbar .pj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbar .ed{display:flex;align-items:center;gap:var(--xrcc-spacing-12);color:var(--text2);width:141px;flex:none}
.xbar .bh{height:40px;align-self:flex-end;margin-bottom:0;padding:0 var(--xrcc-spacing-24);display:flex;align-items:center;gap:10px;background:#2b2639;color:var(--text3);border-radius:var(--xrcc-radius-sm) var(--xrcc-radius-sm) 0 0;min-width:175px;padding:0 var(--xrcc-spacing-16)}
