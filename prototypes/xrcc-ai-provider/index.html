<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRCC AI Provider · Interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#1e1e21;--panel:#161616;--header:#2a2531;--elevated:#353535;--faded:rgba(255,255,255,.03);
  --muted:#5f4b8b;--pbg:#392e52;--pc:#b89afa;--pc-hover:#9c70ff;
  --t1:#e5e5e5;--t2:#c8c8c8;--t3:#818181;--tdis:#676767;
  --b-sub:#676767;--b-def:#545454;--b-dis:#353535;--b-int:#b89afa;--b-err:#ff453a;--b-faded:rgba(255,255,255,.07);
  --ok:#37954b;--warn:#c7843a;--warn-bg:rgba(199,132,58,.15);--err:#ff453a;--err-bg:rgba(255,69,58,.15);--destr:#a32929;--pink:#562b52;
  font-family:Roboto,system-ui,"Noto Sans TC",sans-serif;font-size:14px;line-height:20px;color:var(--t1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e10;color:var(--t1);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit}
input,select{font:inherit}
svg{display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i16{width:16px;height:16px}.i20{width:20px;height:20px}.i24{width:24px;height:24px}.i12{width:12px;height:12px}
.caption{font-size:11px;line-height:16px}.sm{font-size:12px;line-height:18px}.md{font-size:14px;line-height:20px}.mdb{font-size:14px;line-height:20px;font-weight:700}
.lg{font-size:16px;line-height:24px}.lgb{font-size:16px;line-height:24px;font-weight:700}.hsm{font-size:18px;line-height:24px;font-weight:700}.hmd{font-size:20px;line-height:28px;font-weight:700}.h2{font-size:24px;line-height:32px;font-weight:700}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.tacc{color:var(--pc)}.tok{color:var(--ok)}.twarn{color:var(--warn)}.terr{color:var(--err)}
*{scrollbar-width:thin;scrollbar-color:var(--b-def) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--b-def);border-radius:9999px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--b-int);background-clip:content-box}
*::-webkit-scrollbar-corner{background:transparent}
.dlg .b,.pbody,.rb{overflow-x:hidden}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}.fill{flex:1;min-width:0}.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}
/* Workbench header */
.bench{height:100vh;display:flex;flex-direction:column}
.filemenu{height:36px;background:var(--header);display:flex;align-items:center;gap:4px;padding:0 8px;position:relative;z-index:5}
.filemenu>.mi{height:28px;padding:0 10px;display:flex;align-items:center;border-radius:4px;font-size:12px;line-height:18px;position:relative}
.filemenu>.mi:hover,.filemenu>.mi.on{background:var(--pbg)}
.xlogo{width:20px;height:20px;margin:0 8px;color:var(--t1)}
.menu{position:absolute;top:34px;left:0;min-width:300px;background:#2a2531;border:1px solid var(--b-dis);border-radius:4px;padding:4px 0;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu.on{display:block}
.menu div{padding:0 16px;height:36px;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--t1)}
.menu div:hover{background:var(--pbg)}.menu hr{border:0;border-top:1px solid var(--b-sub);margin:4px 12px}
.menu .k{color:var(--t2);font-size:12px}
.toolbar{height:53px;background:var(--panel);display:flex;align-items:center;gap:24px;padding:0 16px}
.proj{display:flex;align-items:center;gap:8px;padding:8px 0;white-space:nowrap}
.htabs{display:flex}.htab{height:40px;padding:4px 16px;display:flex;align-items:center;gap:10px;min-width:150px;color:var(--t1)}
.htab.on{background:var(--pbg);color:var(--pc)}.htab:hover{background:var(--faded)}.htab.on:hover{background:var(--pbg)}
.tools{display:flex;margin-left:auto}.tb{width:48px;height:53px;display:grid;place-items:center;position:relative;color:var(--t1)}
.tb:hover{background:var(--faded)}.tb .dot{position:absolute;top:14px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--pbg);border:1px solid var(--pc);}
.play{display:flex;gap:2px}.play>span{height:32px;background:var(--pbg);color:var(--t1);display:flex;align-items:center;gap:4px;padding:0 10px;border-radius:8px 0 0 8px;font-size:12px}
.play>.car{padding:0 4px;border-radius:0 8px 8px 0}
.save{height:32px;background:var(--pbg);color:var(--pc);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px}
.stage{flex:1;display:grid;place-items:center;color:var(--t3);background:radial-gradient(circle at 50% 40%,#25222b,#111 70%)}
.hint-bar{position:fixed;left:16px;bottom:16px;background:var(--canvas);border:1px solid var(--b-def);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--t3);display:flex;gap:12px;align-items:center;z-index:20}
.hint-bar button{color:var(--pc);text-decoration:underline}
/* Tooltip (Library Tooltip) */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--canvas);border:1px solid var(--b-def);color:var(--t1);font-size:14px;line-height:20px;padding:4px 8px;border-radius:8px;white-space:nowrap;z-index:60;pointer-events:none}
.tb[data-tip]:hover::after{top:calc(100% - 2px)}
/* Overlay and containers */
.overlay{position:fixed;inset:0;display:none;z-index:10}
.overlay.on{display:block}
.lay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55)}
.panel{width:960px;max-width:100%;max-height:94vh;background:var(--panel);border:1px solid var(--b-sub);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.panel.first{width:760px}
.phead{height:40px;background:var(--header);display:flex;align-items:center;gap:8px;padding-left:16px;flex:none}
.phead .hsm,.phead .lgb{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;color:var(--t1);flex:none}
.iconbtn:hover{background:var(--faded)}
.iconbtn.s28{width:28px;height:28px;border-radius:8px}.iconbtn.s24{width:24px;height:24px;border-radius:4px}
.dock{display:flex;align-items:center;gap:4px;height:28px;padding:4px 8px;background:var(--canvas);border-radius:9999px}
.dock:hover{background:var(--elevated)}
.tabsrow{padding:12px 16px;background:var(--panel);flex:none}
.tabs{display:flex;gap:2px;border-radius:8px;overflow:hidden}
.tab{flex:1;height:36px;padding:8px 24px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--canvas);color:var(--t2)}
.tab:hover{background:var(--elevated)}.tab.on{background:var(--pbg);color:var(--pc)}
.pbody{padding:24px;display:flex;flex-direction:column;gap:24px;overflow:auto;min-height:0}
.panel.first .pbody{padding:48px 24px 24px;align-items:center;gap:32px;min-height:606px}
/* Logo */
.logo{display:grid;place-items:center;background:var(--canvas);border:1px solid var(--b-dis);flex:none;border-radius:8px}
.logo svg{width:60%;height:60%}
.l16{width:16px;height:16px;border-radius:4px}.l20{width:20px;height:20px;border-radius:4px}.l24{width:24px;height:24px;border-radius:4px}.l32{width:32px;height:32px}.l40{width:40px;height:40px}
/* Buttons */
.btn{height:28px;padding:0 8px;border-radius:8px;border:1px solid var(--b-def);background:var(--canvas);color:var(--t1);display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12px;line-height:18px;white-space:nowrap}
.btn:hover{background:var(--elevated)}
.btn.pri{background:var(--pbg);border-color:var(--pbg);color:var(--pc)}.btn.pri:hover{background:#4a3c68}
.btn.out{background:none;border-color:var(--pc);color:var(--pc)}.btn.out:hover{background:var(--pbg)}
.btn.des{background:var(--destr);border-color:var(--destr);color:#fff;padding:0 12px;font-size:14px}.btn.des:hover{background:#b83131}
.btn.inv{background:none;border-color:var(--t1);color:var(--t1)}
.btn.m{height:36px;padding:0 12px;font-size:14px;line-height:20px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lnk{color:var(--pc);text-decoration:underline;text-decoration-color:var(--pc);text-underline-offset:2px;font-size:12px;line-height:18px}
.lnk:hover{color:var(--pc-hover)}
/* Fields */
.field{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:baseline;gap:8px}
.input,.sel{height:36px;width:100%;display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:8px;border:1px solid var(--b-def);background:var(--canvas);color:var(--t1);outline:0;font-size:14px}
.sel{background:var(--panel);padding:8px;justify-content:space-between}.sel span{padding:0 4px}
.input::placeholder{color:var(--t3)}.input:focus,.sel.open{border-color:var(--pc-hover)}
.input.err{border-color:var(--b-err)}
.helper{font-size:12px;line-height:18px;color:var(--t2)}
.menu2{background:var(--canvas);border:1px solid var(--b-dis);border-radius:8px;padding:4px;display:flex;flex-direction:column}
.menu2 .grp{padding:8px 12px 4px;font-size:11px;line-height:16px;color:var(--t3);text-transform:uppercase}
.mitem{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;min-height:40px}
.mitem:hover{background:var(--faded)}.mitem .st{width:24px;display:grid;place-items:center}
.mdiv{height:1px;background:var(--b-sub);margin:4px 0}
/* Cards */
.card{background:var(--canvas);border:1px solid var(--b-sub);border-radius:8px;padding:16px}
.task{display:flex;flex-direction:column;gap:16px;cursor:pointer}
.task:hover{border-color:var(--b-int)}
.task.unset{border:1px dashed var(--b-def)}.task.blocked{background:var(--faded)}
.tile{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;flex:none}
.runs{display:flex;align-items:center;gap:8px;padding:8px;background:var(--panel);border-radius:4px;min-height:36px}
.runs.cta{background:var(--muted);min-height:34px}
.dot8{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.prog{display:flex;gap:4px}.prog i{width:24px;height:6px;border-radius:4px;background:var(--b-def)}.prog i.on{background:var(--ok)}
.intro{display:flex;align-items:center;gap:16px;padding:16px;background:var(--muted);border-radius:8px}
.badge{padding:0 8px;height:20px;display:inline-flex;align-items:center;border-radius:9999px;background:var(--faded);border:1px solid var(--b-faded);font-size:11px}
.prow{display:flex;align-items:center;gap:16px;padding:16px;background:var(--elevated);border:1px solid var(--b-sub);border-radius:8px;cursor:pointer}
.pcard{background:var(--canvas);border:1px solid var(--b-def);border-radius:8px;display:flex;flex-direction:column}
.pcard .prow{background:none;border:0}.pcard .det{padding:0 16px 16px;display:flex;flex-direction:column;gap:16px}
.warn{display:flex;gap:12px;padding:12px;background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;color:var(--warn)}
.warn b{color:var(--warn);display:block}.warn span{color:var(--t1)}
.errbox{display:flex;gap:16px;padding:16px;background:var(--err-bg);border:1px solid var(--b-err);border-radius:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;height:30px;padding:4px 12px 4px 4px;border-radius:9999px;background:var(--canvas);border:1px solid var(--b-sub);color:var(--t2);font-size:12px;line-height:18px;cursor:pointer}
.chip:hover{border-color:var(--b-int)}.chip.on{background:var(--pbg);border-color:var(--b-int);color:var(--pc)}
.chip.txt{height:28px;padding:4px 12px}.chip .logo{margin-right:4px}
.voice{display:flex;flex-direction:column;gap:12px}
.voice:hover{border-color:var(--b-int)}.voice.play{border-color:var(--b-int)}
.pbtn{width:40px;height:40px;border-radius:9999px;background:var(--muted);display:grid;place-items:center;flex:none;color:var(--t1)}
.voice.play .pbtn{background:var(--pbg)}.voice.gone{background:var(--faded)}.voice.gone .pbtn{background:var(--canvas);color:var(--tdis)}
.tag{display:inline-flex;align-self:flex-start;padding:4px 8px;border-radius:9999px;background:var(--panel);color:var(--t2);font-size:11px;line-height:16px}
.wave{display:flex;gap:4px;align-items:center;height:20px}.wave i{width:2px;background:var(--pc);border-radius:1px;animation:w 1.1s infinite ease-in-out}
@keyframes w{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1)}}
.new{border:1px dashed var(--b-def);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;cursor:pointer;min-height:112px}
.new:hover{border-color:var(--b-int)}.new .pbtn{background:var(--muted)}
.skel{height:56px;border-radius:8px;background:var(--canvas);display:flex;gap:12px;padding:12px;align-items:center}
.skel i{background:var(--elevated);border-radius:4px;display:block;animation:sk 1.2s infinite}
@keyframes sk{50%{opacity:.5}}
.grid3>*{min-width:0}.sess{display:flex;flex-direction:column;gap:12px}
.marq{margin-top:auto;overflow:hidden;width:100%;min-width:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marq .track{display:flex;gap:8px;width:max-content;animation:marq 28s linear infinite;padding-right:8px}
.marq:hover .track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq .track{animation:none}}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9999px;color:var(--t2);font-size:12px;line-height:18px}
.orbit{position:relative;width:360px;height:200px;flex:none}
.orbit .el{position:absolute;border:1px dashed var(--b-def);border-radius:50%;left:20px;top:15px;width:320px;height:170px}
.orbit .el.in{border-color:var(--b-sub);left:80px;top:48px;width:200px;height:104px}
.orbit .core{position:absolute;left:148px;top:68px;width:64px;height:64px;border-radius:16px;background:var(--pbg);display:grid;place-items:center;color:var(--pc);transform:rotate(8deg)}
.orbit .logo{position:absolute}.orbit .sp{position:absolute;border-radius:50%;background:var(--pc);opacity:.7}
/* Dialog (Library Dialog) */
.dlg{width:600px;max-width:100%;max-height:94vh;display:flex;flex-direction:column;background:var(--canvas);border:1px solid var(--b-sub);border-radius:16px;overflow:hidden}
.dlg.md{width:480px}
.dlg .h{height:48px;padding:8px 12px 8px 20px;display:flex;align-items:center;gap:12px;flex:none}
.dlg .b{background:var(--header);padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.dlg .b .content{display:flex;flex-direction:column;gap:8px}
.dlg .f{padding:12px 20px;display:flex;justify-content:flex-end;gap:8px;flex:none}
.note{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:18px;color:var(--t2)}
.adv{display:flex;flex-direction:column;background:var(--canvas);border-radius:8px}
.adv .top{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer}
.adv .bot{padding:0 16px 16px;display:flex;flex-direction:column;gap:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:9999px;background:var(--pbg);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff}
.ptile{width:96px;flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:8px;background:var(--canvas);border:1px solid var(--b-dis);cursor:pointer}
.ptile:hover{border-color:var(--b-int)}.ptile.on{background:var(--pbg);border-color:var(--b-int)}
.ptile .can{display:flex;gap:4px;align-items:center;color:var(--t2)}
.pick{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;background:var(--canvas);border:1px solid var(--b-sub);cursor:pointer}
.pick:hover{border-color:var(--b-int)}.pick.on{background:var(--pbg);border-color:var(--b-int)}
.pick .pb{width:32px;height:32px;border-radius:50%;background:var(--muted);display:grid;place-items:center;flex:none}
.pick.dis{opacity:.5;cursor:not-allowed}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--b-sub);background:var(--canvas);flex:none;display:grid;place-items:center}
.radio.on{background:var(--pbg);border-color:var(--b-int)}.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc)}
.picker{width:440px;max-width:100%;max-height:94vh;overflow:auto;background:var(--elevated);border:1px solid var(--b-def);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:20px}
.mdl{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;border:1px solid var(--b-sub);cursor:pointer}
.mdl.on{background:var(--pbg);border-color:var(--b-int)}.mdl.dis{cursor:not-allowed;color:var(--tdis)}
/* Settings window */
.win{width:960px;max-width:100%;height:min(720px,94vh);display:flex;background:var(--panel);border:1px solid var(--b-sub);border-radius:16px;overflow:hidden}
.side{width:236px;background:var(--header);display:flex;flex-direction:column;flex:none}
.side .sh{height:40px;background:var(--canvas);display:flex;align-items:center;gap:16px;padding:8px 32px;font-weight:700;font-size:16px;line-height:24px;color:var(--t1)}
.side .ml{padding-top:43px;display:flex;flex-direction:column;flex:1;overflow:auto}
.side .m{min-height:48px;padding:12px 32px 12px 44px;display:flex;align-items:center;gap:16px;color:var(--t1);font-size:14px}
.side .m.on{background:var(--canvas);color:var(--pc);border-radius:24px 0 0 24px;margin-left:12px;padding-left:20px}
.side .ver{height:100px;padding:16px 32px;color:var(--t3);font-size:14px;margin-top:auto;display:flex;align-items:flex-end}
.rp{flex:1;display:flex;flex-direction:column;min-width:0}
.rp .tb2{height:40px;background:var(--canvas);display:flex;justify-content:flex-end;flex:none}
.rp .rb{flex:1;overflow:auto;padding:32px 45px;display:flex;flex-direction:column;gap:32px;background:var(--panel)}
.krow{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--canvas);border-radius:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--elevated);border:1px solid var(--b-def);padding:8px 16px;border-radius:8px;display:none;z-index:70;font-size:14px}
.toast.on{display:block}
</style>
</head>

 <div class="field"><div class="lrow"><span class="mdb">API key</span><span class="sm t3">Optional</span></div><div class="sel"><span class="md fill">No key</span>${ic('Down','i12')}</div></div>${inp('Model name','llama-3.3-70b','','Type it exactly as your server expects.')}
 <div class="adv"><div class="top" data-cadv>${ic('Chevron')}<span class="md t2">Advanced</span><span class="fill"></span><span class="sm t3" data-csum>OpenAI format · 30 s timeout</span><button class="btn" data-noop data-creset style="display:none">Reset</button></div></div>
 <div data-cbody class="col g16" style="display:none"><div class="field"><div class="lrow"><span class="mdb">Request format</span></div><div class="sel"><span class="md fill">OpenAI chat completions</span>${ic('Down','i12')}</div></div>${inp('Timeout','30 s')}${inp('Extra header','','Optional, e.g. X-Studio: lobby')}</div></div>`,`${cancel}<button class="btn pri" data-customadd>Add provider</button>`,'sub')}
function keyDlg(){dlg('Add an AI key',`<div class="lg">Keys stay on this computer. VOTANIC never sees them.</div><div class="content">${inp('Key name','Office Key','Office Key','Only you see this name.')}
 <div class="col g8"><div class="mdb">Provider</div><div class="row g8" style="flex-wrap:wrap">${Object.entries(P).map(([i,v])=>`<button class="chip ${S.addSel===i?'on':''}" data-ksel="${i}">${lg(i,20)}${v.n}</button>`).join('')}</div></div>
 <div class="field"><div class="mdb">API key</div><input class="input" id="kv" type="password" placeholder="Paste your key"><button class="lnk" data-ext style="align-self:flex-start" data-tip="Opens Google AI Studio in your browser">Where do I find my ${P[S.addSel].n} key?</button></div>
 ${inp('Password','','Add a password',"Asked each time a project opens. It can't be recovered, so pick one you'll remember.",1,'password')}</div>`,`${cancel}<button class="btn pri" data-savekey>Save key</button>`,S.fromSettings?'':'sub')}
function removeDlg(id){const p=prov(id);const n=P[p.pid].n;dlg(`Remove ${n}?`,`<div class="row g20" style="gap:20px;align-items:flex-start"><span style="color:var(--t1)">${ic('Trash','i24','width:72px;height:72px;stroke-width:.75')}</span><div class="col g12 fill"><div class="lg">Text to speech and Text to music will stop until you pick another provider. Two voice presets use ${n} and will play the fallback voice instead.</div><div class="note">${ic('Key')}<span>Your ${n} key stays in Key Management, so you can add it back any time.</span></div></div></div>`,`${cancel}<button class="btn des" data-rm="${id}">Remove ${n}</button>`,'md')}
function unlockDlg(id,err){const p=prov(id);const k=keyOf(p);dlg(`Unlock your ${P[p.pid].n} key`,`<div class="lg">Enter the password you set when you saved this key.</div><div class="content"><div class="row g12" style="padding:12px;background:var(--canvas);border-radius:8px"><div class="tile" style="width:32px;height:32px;background:var(--muted)">${ic('Lock')}</div><div class="col g4 fill"><b class="mdb">${k.name}</b><span class="sm t2">${P[p.pid].n} · added 12 Oct 2026</span></div></div>
 <div class="field"><div class="mdb">Key password</div><input class="input ${err?'err':''}" id="pw" type="password" value="${err?'••••••••':''}" placeholder="Password">${err?`<div class="caption terr">That password doesn't match. Check Caps Lock and try again.</div>`:''}</div><div class="note">${ic('Question')}<span>Forgot it? Passwords can't be recovered. Remove the key and add it again in Key Management. (Prototype password: xrcc)</span></div></div>`,`${cancel}<button class="btn pri" data-doun="${id}">Unlock</button>`,'md')}
function newVoice(){const picks=[['Lyrical','Calm, mid pitch'],['Newsreader','Clear, steady'],['Auntie Mei','Warm, chatty'],['Young explorer','Bright, quick']];
 dlg('New voice preset',`<div class="lg">Pick a voice by ear. You can change it any time.</div><div class="content">${inp('Name','Museum guide')}
 <div class="col g8"><div class="mdb">Voice from</div><div class="row g8"><button class="chip on">${lg('minimax',20)}MiniMax</button><button class="chip">${lg('gemini',20)}Gemini</button></div></div>
 <div class="row g16"><div class="field fill"><div class="mdb">Model</div><div class="sel"><span class="md fill">Speech 2.8 HD</span>${ic('Down','i12')}</div></div><div class="field fill"><div class="mdb">Language</div><div class="sel"><span class="md fill">Cantonese</span>${ic('Down','i12')}</div></div></div>
 <div class="col g8"><div class="row"><span class="mdb fill">Voice</span><span class="sm t3">12 Cantonese voices</span></div><div class="grid3" style="grid-template-columns:1fr 1fr;gap:16px">${picks.map((v,i)=>`<div class="pick ${i===0?'on':''}"><span class="pb" ${i===1?'style="background:var(--pbg)"':''}>${ic(i===1?'Stop':'Play')}</span><div class="col g4 fill"><b class="mdb ${i===0?'tacc':''}">${v[0]}</b>${i===1?`<div class="wave" style="height:12px;gap:4px">${[4,7,11,6,10,12,5,8,11,4,7,10,6,12].map((h,j)=>`<i style="height:${h}px;animation-delay:${j*60}ms"></i>`).join('')}</div>`:`<span class="sm t2">${v[1]}</span>`}</div></div>`).join('')}</div></div>
 <div class="row g12" style="align-items:flex-end"><div class="field fill"><div class="mdb">Preview line</div><input class="input" value="早晨！歡迎嚟到博物館。"></div><button class="btn out">Play all</button></div>
 <div class="adv"><div class="top" data-adv>${ic('Chevron','i16',S.advOpen?'transform:rotate(90deg)':'')}<span class="md t2">Advanced</span><span class="fill"></span>${S.advOpen?'<button class="btn" data-noop>Reset</button>':'<span class="sm t3">Speed 1.0 · Pitch 0 · Emotion auto</span>'}</div>
 ${S.advOpen?`<div class="bot"><div class="col g8"><div class="row sm t2"><span class="fill">Speed</span><span class="t1">1.0×</span></div><input type="range" min="0" max="100" value="50"></div><div class="col g8"><div class="row sm t2"><span class="fill">Pitch</span><span class="t1">0</span></div><input type="range" min="0" max="100" value="50"></div><div class="col g8"><span class="sm t2">Emotion</span><div class="sel"><span class="md fill">Auto</span>${ic('Down','i12')}</div></div></div>`:''}</div></div>`,`${cancel}<button class="btn pri" data-savev>Save preset</button>`)}
function pickDlg(id){const t=TASKS.find(x=>x.id===id);const ps=S.providers;
 if(!S.pick||S.pick.t!==id){const first=ps.find(p=>can(p,t)&&!isLocked(p));S.pick={t:id,p:first?first.id:null,m:0}}
 const sp=prov(S.pick.p);
 const choice=p=>{const ok=can(p,t),lk=isLocked(p);const on=S.pick.p===p.id;const sub=!ok?(t.id==='quiz'&&!P[p.pid].pdf?'No PDFs':'No '+CNAME[t.cap]):(t.id==='quiz'?'Reads PDFs':'');
  return `<button class="mitem" style="flex:1 1 0;min-width:0;min-height:56px;white-space:nowrap;border:1px solid ${on?'var(--b-int)':'var(--b-sub)'};background:${on?'var(--pbg)':'var(--canvas)'};padding:8px 12px 8px 8px;${ok&&!lk?'':'opacity:.85'}" ${ok&&!lk?`data-pp="${p.id}"`:lk?`data-unlock="${p.id}"`:''}>${lg(p.pid,20)}<span class="col fill"><b class="mdb ${on?'tacc':''}">${P[p.pid].n}</b>${sub?`<span class="caption t2">${sub}</span>`:''}</span>${lk?ic('Lock'):''}</button>`};
 let models='';
 if(sp){const list=(MODELS[t.id]&&MODELS[t.id][sp.pid])||[[model(sp,t),'The only model here. Nothing else to pick.','']];
  models=`<div class="col g8"><div class="caption t2">MODEL</div>${list.map((m,i)=>`<div class="mdl ${S.pick.m===i&&!m[3]?'on':''} ${m[3]?'dis':''}" ${m[3]?'':`data-pm="${i}"`}><span class="radio ${S.pick.m===i&&!m[3]?'on':''}"></span><div class="col g4 fill"><b class="mdb ${m[3]?'':'t1'}">${m[0]}</b><span class="sm ${m[3]?'':'t2'}">${m[1]}</span></div><span class="caption t2">${m[2]||''}</span></div>`).join('')}</div>`}
 const mname=sp?(((MODELS[t.id]&&MODELS[t.id][sp.pid])||[[model(sp,t)]])[S.pick.m]||[model(sp,t)])[0]:'';
 push(`<div class="picker"><div class="row g12"><div class="tile" style="width:32px;height:32px;background:${t.bg};color:${t.fg}">${ic(t.i,'i16')}</div><span class="hsm fill">Who runs ${t.n}?</span><button class="iconbtn s28" data-back data-tip="Close">${ic('Close')}</button></div>
 ${ps.length?`<div class="col g8"><div class="caption t2">PROVIDER</div><div class="row g8">${ps.map(choice).join('')}</div></div>${models}${sp?'':`<div class="note">${ic('Question')}<span>None of your providers can do ${CNAME[t.cap]} yet. Add one that can, such as Gemini or Poe, then come back.</span></div>`}<div class="row g12">${sp?'<button class="btn" data-sample>Try a sample question</button>':'<button class="btn" data-back>Cancel</button>'}<span class="fill"></span>${sp?`<button class="btn pri" data-set="${id}|${sp.id}">Use ${P[sp.pid].n}</button>`:'<button class="btn pri" data-add>Add a provider</button>'}</div>`:`<div class="md">Add a provider first.</div><button class="btn pri m" data-add>Add a provider</button>`}</div>`,'pick')}
function launchDlg(){hide();dlg('One more step before Lobby · Museum tour opens',`<div class="lg">This project uses AI. Choose which saved key each provider should use. Keys stay on this computer.</div><div class="content">
 ${[['gemini','Text chat, Transcription','Office Key · ends 4F2A',1],['minimax','Text to speech, Text to music','Voice Lab key · ends 91C7',0]].map(r=>`<div class="col g8" style="padding:16px;background:var(--canvas);border-radius:8px"><div class="row g12">${lg(r[0],32)}<div class="col g4 fill"><b class="mdb">${P[r[0]].n}</b><span class="sm t2">${r[1]}</span></div><span class="row g4 caption tok">${ic('Check')}Key chosen</span></div><div class="sel"><span class="md fill">${r[2]}</span>${ic('Down','i12')}</div>${r[3]?`<div class="note">${ic('World')}<span>Gemini needs a VPN in Hong Kong. Turn it on before you start.</span></div>`:''}</div>`).join('')}
 <div class="row g12 note" style="padding:12px;border:1px solid var(--b-def);border-radius:8px;align-items:center">${ic('Lock')}<span>Poe is also used, but its key is locked. You can unlock it inside XRCC.</span></div></div>`,`<button class="btn m" data-addkey>Manage keys</button><button class="btn out m" data-back>Start without AI</button><button class="btn pri m" data-back>Start XRCC</button>`)}
function settings(over){
 const items=[['Display','Display'],['Control','Mouse'],['Edit','Pencil'],['Networking','Wifi'],['Sketchfab','Image'],['Security and Privacy','Shield'],['Licensing','Id'],['Devices','Head'],['Connections','Link']];
 (over?(h=>push(h,'settings')):show)(`<div class="win"><div class="side"><div class="sh">${ic('Set','i20')}My Setting</div><div class="ml">${items.map(i=>`<div class="m ${i[0]==='Connections'?'on':''}">${ic(i[1],'i20')}${i[0]}</div>`).join('')}</div><div class="ver">Version 3.1.0</div></div>
 <div class="rp"><div class="tb2"><button class="iconbtn" data-x data-tip="Close">${ic('Close')}</button></div><div class="rb">
  <div class="col g4"><div class="h2">Connections</div><div class="md t2">Keys are encrypted and kept on this computer. Projects never contain them, and VOTANIC never sees them.</div></div>
  <div class="col g12"><div class="row g12" style="align-items:center"><div class="col g4 fill"><div class="lgb">AI keys</div><div class="sm t2">Used by AI providers in every project on this computer.</div></div><button class="btn pri" data-addkey2 style="height:36px">Add key</button></div><div class="input" style="width:100%;height:36px;color:var(--t3);display:flex;align-items:center;gap:8px">${ic('Search')}Search keys</div>
  <div class="col g8">${S.keys.map(k=>`<div class="krow">${lg(k.prov,32)}<div class="col g4 fill"><b class="mdb">${k.name}</b><span class="sm t2">${k.meta}</span></div><span class="row g4 sm ${k.pw?'tacc':'t2'}">${ic(k.pw?'Lock':'Key')}${k.pw?'Password set':'No password'}</span><span style="position:relative"><button class="iconbtn s28" data-kmenu="${k.id}" ${S.kmenu===k.id?'':'data-tip="More actions"'}>${ic('MoreH')}</button>${S.kmenu===k.id?`<div class="menu on" style="left:auto;right:0;min-width:200px;z-index:5"><div data-kact="pw|${k.id}">${k.pw?'Change password':'Set password'}</div><div data-kact="ren|${k.id}">Rename</div><hr><div data-kact="del|${k.id}" style="color:#ff8a8a">Remove key</div></div>`:''}</span></div>`).join('')}</div></div>
  <div class="col g8"><div class="lg" style="padding-left:16px">Speech commands (Wit.ai)</div><div class="krow"><span class="logo l32" style="background:#510e69;border-color:#510e69"><svg viewBox="0 0 24 24"><use href="#lg-wit"/></svg></span><div class="col g4 fill"><b class="mdb">Lobby kiosk token</b><span class="sm t2">Wit.ai · last used 28 Oct</span></div><span class="row g4 sm t2">${ic('Key')}No password</span><button class="iconbtn s28">${ic('MoreH')}</button></div></div>
 </div></div></div>`)}
/* events */
const MENUS=$('#helpBtn');
document.addEventListener('click',e=>{
 const hb=e.target.closest('#helpBtn');
 if(e.target.closest('#mySettings')){$('#helpMenu').classList.remove('on');MENUS.classList.remove('on');S.fromSettings=true;return settings()}
 if(hb){const m=$('#helpMenu');m.classList.toggle('on');MENUS.classList.toggle('on');return}
 $('#helpMenu').classList.remove('on');MENUS.classList.remove('on');
 const km=e.target.closest('[data-kmenu]'),ka=e.target.closest('[data-kact]');
 if(ka){const [a,id]=ka.dataset.kact.split('|');S.kmenu=null;const k=S.keys.find(k=>k.id===id);
  if(a==='del'){S.keys=S.keys.filter(k=>k.id!==id);toast('Key removed')}
  else if(a==='pw'){k.pw=true;toast('Password set')}
  else toast('Rename “'+k.name+'”');
  return settings()}
 if(km){S.kmenu=S.kmenu===km.dataset.kmenu?null:km.dataset.kmenu;return settings()}
 if(S.kmenu&&ov.querySelector('.win')){S.kmenu=null;settings()}
 const t=e.target.closest('[data-x],[data-back],[data-clone],[data-manage],[data-ext],[data-tab],[data-add],[data-sel],[data-connect],[data-task],[data-set],[data-prov],[data-test],[data-unlock],[data-doun],[data-remove],[data-rm],[data-play],[data-all],[data-vs],[data-vf],[data-newv],[data-savev],[data-addkey],[data-addkey2],[data-savekey],[data-news],[data-menu],[data-pickkey],[data-ksel],[data-customadd],[data-adv],[data-cadv],[data-pp],[data-pm],[data-sample],#openAI,#reset,#dLoad,#dFail,#dLaunch');
 if(!t)return;const d=t.dataset;
 if(t.id==='openAI')return openPanel();
 if(t.id==='reset'){S=init();hide();return toast('Prototype reset')}
 if(t.id==='dLoad'){S.tab='voices';S.vstate='loading';if(!S.providers.length)S.providers.push({id:'p1',pid:'minimax',key:'k2'});renderPanel();setTimeout(()=>{S.vstate='ok';if(ov.querySelector('.skel'))renderPanel()},2000);return}
 if(t.id==='dFail'){S.tab='voices';S.vstate='error';if(!S.providers.length)S.providers.push({id:'p1',pid:'minimax',key:'k2'});return renderPanel()}
 if(t.id==='dLaunch')return launchDlg();
 if(d.clone){S.cloneBanner=false;if(d.clone==='pick')toast('Pick any voice below to replace Grandpa Lau');else toast('Warm host stays as the fallback');return renderPanel()}
 if('manage' in d){S.fromSettings=true;return settings(true)}
 if('ext' in d)return toast('Opens aistudio.google.com/apikey in your browser');
 if('x' in d)return stack.length>1?pop():hide();
 if('back' in d){return stack.length>1?pop():hide()}
 if(d.tab){S.tab=d.tab;S.vstate=S.vstate==='loading'?'ok':S.vstate;return renderPanel()}
 if('add' in d){S.addSel='gemini';S.addKey='k1';S.menuOpen=false;return addDlg()}
 if(d.sel){if(d.sel==='custom')return customDlg();S.addSel=d.sel;S.menuOpen=false;return addDlg()}
 if('menu' in d){S.menuOpen=!S.menuOpen;return addDlg()}
 if(d.pickkey){S.addKey=d.pickkey;S.menuOpen=false;return addDlg()}
 if('addkey' in d||'addkey2' in d){S.fromSettings='addkey2' in d;S.menuOpen=false;return keyDlg()}
 if(d.ksel){S.addSel=d.ksel;return keyDlg()}
 if('savekey' in d){const inps=ov.querySelectorAll('input');const n=inps[0].value||'New key',pw=inps[2]&&inps[2].value;S.keys.push({id:'k'+Date.now(),name:n,prov:S.addSel,meta:P[S.addSel].n+' · added today',pw:!!pw,end:'2C9D'});toast('Key saved');if(S.fromSettings)return settings();S.addKey=S.keys[S.keys.length-1].id;pop();return addDlg()}
 if('customadd' in d){S.providers.push({id:'p'+Date.now(),pid:'custom',key:'k4'});autoAssign();S.tab='providers';toast('Custom connected');return renderPanel()}
 if('connect' in d){const kid=S.addKey;if(!kid)return;if(!S.providers.find(p=>p.pid===S.addSel))S.providers.push({id:'p'+Date.now(),pid:S.addSel,key:kid});autoAssign();S.tab='providers';toast(P[S.addSel].n+' connected');return renderPanel()}
 if(d.task){S.pick=null;return pickDlg(d.task)}
 if(d.pp){S.pick.p=d.pp;S.pick.m=0;return pickDlg(S.pick.t)}
 if(d.pm){S.pick.m=+d.pm;return pickDlg(S.pick.t)}
 if('sample' in d)return toast('Sample question: “Which room has the dinosaur?”');
 if(d.set){const [tid,pid]=d.set.split('|');if(!pid)return;S.assign[tid]=pid;S.tab='tasks';return renderPanel()}
 if(d.test){const p=prov(d.test);toast('Testing '+P[p.pid].n+'…');setTimeout(()=>{p.status=P[p.pid].vpn&&p.status!=='failed'?'failed':'';renderPanel();toast(p.status?'Test timed out':'Connected')},900);return}
 if(d.unlock)return unlockDlg(d.unlock);
 if(d.doun){const v=$('#pw').value;if(v==='xrcc'){const p=prov(d.doun);keyOf(p).locked=false;toast('Key unlocked');return renderPanel()}return unlockDlg(d.doun,true)}
 if(d.remove)return removeDlg(d.remove);
 if(d.rm){S.providers=S.providers.filter(p=>p.id!==d.rm);Object.keys(S.assign).forEach(k=>{if(S.assign[k]===d.rm)delete S.assign[k]});S.open=null;if(!S.providers.length)S.tab='first';return renderPanel()}
 if(d.prov&&!e.target.closest('button')){S.open=S.open===d.prov?null:d.prov;return renderPanel()}
 if(d.play){const v=S.voices.find(v=>v.id===d.play);if(S.playing===v.id){S.playing=null;return renderPanel()}if(S.asking)return;S.playing=null;S.asking=v.id;renderPanel();setTimeout(()=>{S.asking=null;S.playing=v.id;if(ov.querySelector('.panel'))renderPanel();setTimeout(()=>{if(S.playing===v.id){S.playing=null;if(ov.querySelector('.wave'))renderPanel()}},4000)},700);return}
 if('all' in d){toast('Playing each voice with the same line');return}
 if(d.vf){S.vf=d.vf;return renderPanel()}
 if('newv' in d){S.advOpen=false;return newVoice()}
 if('adv' in d){S.advOpen=!S.advOpen;return newVoice()}
 if('cadv' in d){const box=t.closest('.dlg'),b=box.querySelector('[data-cbody]'),open=b.style.display==='none';b.style.display=open?'':'none';t.querySelector('svg,.ico,i')&&(t.firstElementChild.style.transform=open?'rotate(90deg)':'');box.querySelector('[data-csum]').style.display=open?'none':'';box.querySelector('[data-creset]').style.display=open?'':'none';return}
 if('savev' in d){S.voices.push({id:'v'+Date.now(),n:'Museum guide',prov:'minimax',meta:'Cantonese'});S.tab='voices';return renderPanel()}
 if('news' in d){S.sessions.push({n:'New session',u:'Not used yet',p:'“Write the character prompt here.”'});S.tab='sessions';return renderPanel()}
});
function autoAssign(){TASKS.forEach(t=>{if(S.assign[t.id])return;const p=S.providers.find(p=>can(p,t));if(p)S.assign[t.id]=p.id})}
ov.addEventListener('mousedown',e=>{if(e.target.classList.contains('lay'))pop()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='0'){e.preventDefault();S.fromSettings=true;settings()}if(e.key==='Escape')pop()});
</script>
</body>
</html>
