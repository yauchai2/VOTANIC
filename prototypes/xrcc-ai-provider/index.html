<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRCC AI Provider · Interactive prototype</title>
<style>
:root{
  --canvas:#0d0d0d; --panel:#161616; --card:#1f1f1f; --card-2:#262626; --line:#3a3a3a;
  --text:#f2f2f2; --text-2:#c4c4c4; --subtle:#8a8a8a;
  --primary:#6c4fb0; --primary-soft:#2f2540; --primary-text:#cda9ff; --primary-line:#a77be8;
  --ok:#3fb55f; --err:#e5484d; --warn:#e0933a; --warn-bg:#3a2a1c; --destructive:#b4333c;
  --r:8px; --r-lg:16px;
  font-family:Inter,system-ui,"Noto Sans TC",sans-serif; font-size:14px; line-height:20px;
}
*{box-sizing:border-box;margin:0}
body{background:var(--canvas);color:var(--text);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.ico{width:16px;height:16px}.ico.m{width:20px;height:20px}
/* Fake workbench */
.bench{height:100vh;display:flex;flex-direction:column}
.toolbar{height:44px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px}
.toolbar .sp{flex:1}
.tb{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--text-2);position:relative}
.tb:hover{background:var(--card-2)}
.tb.ai{background:var(--primary-soft);color:var(--primary-text)}
.tip{position:absolute;top:36px;right:0;background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;width:260px;font-size:12px;color:var(--text-2);display:none;z-index:3}
.tb.ai:hover .tip{display:block}
.stage{flex:1;display:grid;place-items:center;color:var(--subtle);background:radial-gradient(circle at 50% 40%,#1c1824,#0d0d0d 70%)}
.hint-bar{position:fixed;left:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-size:12px;color:var(--subtle);display:flex;gap:12px;align-items:center}
.hint-bar button{color:var(--primary-text);text-decoration:underline}
/* Overlay + panel */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:10}
.overlay.on{display:grid}
.panel{width:min(982px,96vw);height:min(580px,92vh);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden}
.p-head{background:#2a2236;padding:12px 16px 0}
.p-title{display:flex;align-items:center;gap:12px;height:32px}
.p-title .tile{width:28px;height:28px}
.p-title h1{font-size:16px;font-weight:600}
.p-title .sp{flex:1}
.dock{display:flex;align-items:center;gap:6px;background:#1c1824;border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 6px;font-size:12px}
.dock:hover{border-color:var(--primary-line)}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{height:26px;padding:0 20px;display:flex;align-items:center;gap:8px;background:#181818;color:var(--text-2);font-size:12px;min-width:160px;justify-content:center}
.tab.on{background:var(--primary);color:#fff}
.p-body{flex:1;overflow:auto;padding:20px 32px 24px}
.tile{width:40px;height:40px;border-radius:8px;background:#232323;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.tile.s{width:28px;height:28px}.tile.p{background:var(--primary-soft);color:var(--primary-text);border-color:transparent}
.logo{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;border:1px solid var(--line)}
.logo.s{width:20px;height:20px;border-radius:5px;font-size:10px}
.logo.g{background:#1a1a1a;color:#8ab4f8}.logo.m{background:#241214;color:#ff4d5e}.logo.po{background:#101010;color:#fff}
.logo.o{background:#1b1630;color:#9b8bff}.logo.c{background:#1f1a2b;color:var(--primary-text)}
h2{font-size:20px;line-height:28px;font-weight:600}
.sub{color:var(--text-2);font-size:12px;margin-top:2px}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1}
.btn{height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:#1c1c1c;font-size:12px}
.btn:hover{background:var(--card-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.out{border-color:var(--primary-line);color:var(--primary-text)}
.btn.des{background:var(--destructive);border-color:var(--destructive);color:#fff}
.btn.ghost{border-color:var(--destructive);color:#ff8a8f;background:none}
.btn.l{height:36px;font-size:14px;padding:0 16px}
.btn{white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.banner{background:var(--primary);border-radius:var(--r);padding:16px;display:flex;gap:16px;align-items:center;margin-bottom:24px}
.banner b{display:block;font-size:14px}.banner span{font-size:12px;color:#eadcff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.click:hover{border-color:var(--primary-line);cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.task{display:flex;flex-direction:column;gap:12px;min-height:150px}
.task h3{font-size:14px}.task p{font-size:12px;color:var(--text-2)}
.task .by{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px}
.task.unset{border-style:dashed}.task.blocked{opacity:.8}
.pill{font-size:11px;padding:0 8px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);color:var(--text-2);line-height:18px;display:inline-block}
.pill.ok{color:#7fdc98;border-color:#2c5a3a}.pill.err{color:#ff8a8f;border-color:#6b2b2e}.pill.lock{color:var(--warn);border-color:#6b4a22}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.dot.err{background:var(--err)}.dot.lock{background:var(--subtle)}
.prov{display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.prov .info b{font-size:14px;display:block}.prov .info span{font-size:12px;color:var(--text-2);display:flex;gap:6px;align-items:center}
.prov .more{flex-basis:100%;border-top:1px solid var(--line);padding-top:12px;display:none}
.prov.open .more{display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 6px;font-size:12px;background:var(--card);cursor:pointer}
.chip.on{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary-text)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12px;font-weight:600}
input,select,textarea{font:inherit;color:var(--text);background:#121212;border:1px solid var(--line);border-radius:6px;height:36px;padding:0 10px;width:100%}
input:focus,select:focus{outline:1px solid var(--primary-line)}
.err-t{color:#ff8a8f;font-size:12px}
.warn{background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--r);padding:12px;display:flex;gap:10px;color:var(--warn);margin-bottom:12px}
.warn b{display:block;font-size:13px}.warn span{color:var(--text);font-size:12px}
.warn .acts{display:flex;gap:8px;margin-top:8px}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.voice{display:flex;flex-direction:column;gap:12px}
.voice.play{border-color:var(--primary-line)}
.voice .top{display:flex;gap:12px;align-items:center}
.pbtn{width:40px;height:40px;border-radius:50%;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center;flex:none}
.voice.gone .pbtn{background:#1c1c1c;color:var(--subtle)}
.wave{display:none;gap:3px;align-items:center;height:20px}.voice.play .wave{display:flex}
.wave i{width:2px;background:var(--primary-text);border-radius:1px;animation:w 1s infinite ease-in-out}
@keyframes w{0%,100%{height:5px}50%{height:20px}}
.new{border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--primary-text);font-weight:600;cursor:pointer;min-height:120px}
.new:hover{border-color:var(--primary-line)}
.skel{height:56px;border-radius:var(--r);background:linear-gradient(90deg,#1f1f1f,#2a2a2a,#1f1f1f);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.foot{color:var(--subtle);font-size:12px;margin-top:24px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;max-width:460px;margin:auto}
.orbit{width:140px;height:140px;border-radius:50%;border:1px dashed var(--line);display:grid;place-items:center;position:relative;margin-bottom:8px}
.orbit .core{width:64px;height:64px;border-radius:16px;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center}
.orbit .sat{position:absolute;width:28px;height:28px;border-radius:8px;font-size:11px;font-weight:700;display:grid;place-items:center;border:1px solid var(--line);background:#1c1c1c}
.empty h2{font-size:28px;line-height:36px}
/* Dialog */
.dlg{width:min(600px,94vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.dlg .h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg .h h3{flex:1;font-size:16px}
.dlg .b{padding:20px}.dlg .f{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.ptiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 12px}
.pt{border:1px solid var(--line);border-radius:var(--r);padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);cursor:pointer;font-weight:600;font-size:13px}
.pt.on{border-color:var(--primary-line);background:var(--primary-soft)}
.pt .cap{display:flex;gap:4px;align-items:center;color:var(--subtle);font-size:11px;font-weight:400}
.pt.on .cap{color:var(--primary-text)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;cursor:pointer;background:var(--card)}
.pick.on{border-color:var(--primary-line);background:var(--primary-soft)}
details{margin-top:8px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}summary{cursor:pointer;font-weight:600}
/* Settings + launcher */
.set{display:grid;grid-template-columns:220px 1fr;height:100%}
.nav{background:#241c30;padding:16px;display:flex;flex-direction:column;gap:4px}
.nav h4{font-size:16px;margin-bottom:8px}.nav div{padding:6px 12px;border-radius:6px;color:var(--text-2)}
.nav .on{background:var(--primary);color:#fff}
.keyrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px}
.keyrow .t{flex:1}.keyrow .t b{display:block}.keyrow .t span{font-size:12px;color:var(--text-2)}
.keyrow .prot{font-size:12px;color:var(--primary-text);display:flex;gap:4px;align-items:center}.keyrow .prot.n{color:var(--text-2)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card-2);border:1px solid var(--line);padding:10px 16px;border-radius:var(--r);display:none;z-index:50}
.toast.on{display:block}
@media(max-width:760px){.grid3,.vgrid{grid-template-columns:1fr}.tab{min-width:0;padding:0 10px}.p-body{padding:16px}.ptiles{grid-template-columns:repeat(2,1fr)}.picks{grid-template-columns:1fr}.set{grid-template-columns:1fr}.nav{display:none}}
</style>
</head>
<body>
<div class="bench">
  <div class="toolbar">
    <span style="font-weight:600">XRCC Workbench</span><span class="sp"></span>
    <button class="tb" title="Settings" id="openSettings"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></button>
    <button class="tb ai" id="openAI" aria-label="AI"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span class="tip">AI providers · Connect Gemini, MiniMax, Poe or your own server</span></button>
  </div>
  <div class="stage">Your project workspace</div>
</div>
<div class="hint-bar">Prototype of the XRCC AI Provider flow <button id="reset">Reset</button></div>
<div class="overlay" id="ov"></div>
<div class="toast" id="toast"></div>

<script>
const IC={
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
 chat:'<path d="M4 5h16v11H11l-4 4v-4H4z"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"/>',
 quiz:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 14l2 2 4-4"/>',
 speech:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/>',
 music:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
 plug:'<path d="M9 3v5M15 3v5M6 8h12v4a6 6 0 01-12 0zM12 18v3"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 play:'<path d="M8 5l11 7-11 7z"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',
 world:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 warn:'<path d="M12 4l10 17H2z"/><path d="M12 10v5M12 18h.01"/>',more:'<path d="M5 12h.01M12 12h.01M19 12h.01"/>',
 img:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 18l6-5 4 3 3-2 3 3"/>'
};
const ic=(n,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24">${IC[n]}</svg>`;
const PROV={
 gemini:{n:'Gemini',cls:'g',ini:'G',caps:['chat','quiz','speech','mic'],vpn:true,model:'Gemini 3.1 Flash',pdf:true},
 minimax:{n:'MiniMax',cls:'m',ini:'M',caps:['chat','speech','music'],model:'MiniMax M2',pdf:false},
 poe:{n:'Poe',cls:'po',ini:'P',caps:['chat','quiz','speech','music','img','mic'],model:'Claude via Poe',pdf:true},
 openrouter:{n:'OpenRouter',cls:'o',ini:'O',caps:['chat','quiz','img'],model:'Router auto',pdf:true},
 custom:{n:'Custom',cls:'c',ini:'C',caps:['chat'],model:'Your server',pdf:false}
};
const CAPN={chat:'chat',quiz:'quiz',speech:'speech',mic:'transcription',music:'music',img:'images'};
const TASKS=[
 {id:'chat',n:'AI chat',i:'chat',d:'Characters answer visitors in their own voice.',cap:'chat'},
 {id:'quiz',n:'AI quiz',i:'quiz',d:'Quiz learners on a PDF you pick.',cap:'quiz'},
 {id:'tts',n:'Text to speech',i:'speech',d:'Read lines out loud in Cantonese.',cap:'speech'},
 {id:'stt',n:'Speech to text',i:'mic',d:'Turn what visitors say into text.',cap:'mic'},
 {id:'music',n:'Text to music',i:'music',d:'Make background music from a prompt.',cap:'music'},
 {id:'img',n:'Image',i:'img',d:'Generate pictures for scenes.',cap:'img'}
];
const KEYS0=[
 {id:'k1',name:'Office Key',prov:'gemini',meta:'Gemini · last used 3 Nov',pw:false},
 {id:'k2',name:'Voice Lab key',prov:'minimax',meta:'MiniMax · last used today',pw:false},
 {id:'k3',name:'Team Poe key',prov:'poe',meta:'Poe · added 12 Oct',pw:true,locked:true},
 {id:'k4',name:'Studio LLM token',prov:'custom',meta:'Custom · 192.168.1.20',pw:false}
];
const init=()=>({
 tab:'tasks',providers:[],keys:JSON.parse(JSON.stringify(KEYS0)),
 assign:{},voices:[
  {id:'v1',n:'Warm host',prov:'minimax',meta:'Cantonese',tag:'Used by 3 characters'},
  {id:'v2',n:'Museum guide',prov:'gemini',meta:'English · Kore'},
  {id:'v3',n:'Quiz master',prov:'gemini',meta:'English · Puck',tag:'Default for AI quiz'},
  {id:'v4',n:'Grandpa Lau',prov:'minimax',meta:'Cantonese · clone',gone:true}],
 playing:null,vstate:'ok',preview:'Welcome to the gallery! Mind the dinosaur, he bites.',
 sessions:[{n:'Friendly docent',u:'Used in 3 behaviours',p:'“You are a cheerful museum guide. Keep every answer short and kind.”'},{n:'Fire safety coach',u:'Used in 1 behaviour',p:'“Ask one question at a time. If the learner is wrong, hint first.”'}],
 open:null,settingsOpen:false
});
let S=init();
const $=s=>document.querySelector(s), ov=$('#ov');
const logo=(p,s)=>`<span class="logo ${PROV[p].cls} ${s?'s':''}">${PROV[p].ini}</span>`;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)};
const prov=id=>S.providers.find(p=>p.id===id);
const lockedKey=p=>{const k=S.keys.find(k=>k.id===p.key);return k&&k.locked};
function ready(t){const p=prov(S.assign[t.id]);return p&&!lockedKey(p)&&p.status!=='failed'}
function show(html,cls){ov.innerHTML=html;ov.classList.add('on');ov.dataset.c=cls||''}
function hide(){ov.classList.remove('on');ov.innerHTML=''}
/* Panel */
function openPanel(){
  if(!S.providers.length){S.tab='first'}else if(S.tab==='first'){S.tab='tasks'}
  renderPanel()}
function renderPanel(){
  if(S.tab==='first'){return show(`<div class="panel"><div class="p-head" style="background:var(--panel)"><div class="p-title"><div class="tile s p">${ic('spark')}</div><h1>AI</h1><span class="sp"></span><button class="tb" data-x>${ic('close')}</button></div></div><div class="p-body"><div class="empty"><div class="orbit"><div class="core">${ic('spark','m')}</div><span class="sat" style="top:-8px;left:56px;color:#8ab4f8">G</span><span class="sat" style="top:60px;right:-10px;color:#ff4d5e">M</span><span class="sat" style="bottom:-6px;left:30px">P</span></div><h2>Give your project a brain and a voice</h2><p class="sub">Connect an AI provider to chat in character, quiz learners on a PDF, or read lines out loud in Cantonese.</p><button class="btn pri l" data-add>Add a provider</button></div></div></div>`);}
  const n=TASKS.filter(ready).length;
  const dock=S.providers.map(p=>logo(p.pid,1)).join('');
  const tabs=[['tasks',`${ic('spark')} Tasks · ${n}/6`],['voices',`${ic('speech')} Voices · ${S.voices.length}`],['sessions',`${ic('chat')} Sessions · ${S.sessions.length}`],['providers',`${ic('plug')} Providers · ${S.providers.length}`]];
  const body={tasks,voices,sessions,providers}[S.tab]();
  show(`<div class="panel"><div class="p-head"><div class="p-title"><div class="tile s p">${ic('spark')}</div><h1>AI</h1><span class="sp"></span><button class="dock" data-tab="providers">${dock}<span>${S.providers.length} provider${S.providers.length>1?'s':''}</span></button><button class="tb" data-x>${ic('close')}</button></div><div class="tabs">${tabs.map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div></div><div class="p-body">${body}</div></div>`);
}
function tasks(){
  const n=TASKS.filter(ready).length;
  return `<div class="row" style="margin-bottom:16px"><div><h2>${n} of 6 tasks are ready</h2><p class="sub">Pick who does each job. Providers are set up once, in Providers.</p></div></div><div class="grid3">${TASKS.map(t=>{
    const p=prov(S.assign[t.id]);const bad=p&&lockedKey(p);
    const cls=!p?'unset':bad?'blocked':'';
    const by=!p?`<span style="color:var(--primary-text)">Choose a provider</span>`:bad?`${logo(p.pid,1)}<span class="pill lock">Needs ${PROV[p.pid].n}. Unlock its key to use.</span>`:`${logo(p.pid,1)}<span>${PROV[p.pid].n} · ${S.assign[t.id+'m']||PROV[p.pid].model}</span><span class="pill ok">Ready</span>`;
    return `<div class="card click task ${cls}" data-task="${t.id}"><div class="tile p">${ic(t.i,'m')}</div><h3>${t.n}</h3><p>${t.d}</p><div class="by">${by}</div></div>`}).join('')}</div>`}
function providers(){
  return `<div class="banner"><div class="tile p">${ic('spark')}</div><div><b>Bring your own AI</b><span>Pick a provider for each task. Your keys stay encrypted on this computer and never pass through VOTANIC.</span></div></div>
  <div class="row" style="margin-bottom:12px"><h2 style="font-size:16px">Connected providers <span class="pill">${S.providers.length}</span></h2><span class="sp"></span><button class="btn" data-add>Add provider</button></div>
  ${S.providers.map(p=>{const k=S.keys.find(k=>k.id===p.key);const lk=k&&k.locked;const st=lk?`<span class="dot lock"></span> Key locked · enter its password`:p.status==='failed'?`<span class="dot err"></span><span style="color:#ff8a8f">Test failed</span> · couldn't reach ${PROV[p.pid].n}`:`<span class="dot"></span><span style="color:#7fdc98">Connected</span> · ${k.name}`;
   return `<div class="card prov ${S.open===p.id?'open':''}" data-prov="${p.id}">${logo(p.pid)}<div class="info sp"><b>${PROV[p.pid].n}</b><span>${st}</span></div>${lk?`<button class="btn out" data-unlock="${p.id}">Unlock</button>`:`<button class="btn ${p.status==='failed'?'out':''}" data-test="${p.id}">${p.status==='failed'?'Test again':'Test'}</button>`}
   ${p.status==='failed'&&PROV[p.pid].vpn?`<div class="warn" style="flex-basis:100%;margin:0">${ic('world')}<div><b>Gemini might be blocked where you are</b><span>Your key looks fine, but the request timed out. Turn on your VPN, then test again.</span></div></div>`:''}
   <div class="more"><div class="chips" style="margin-bottom:12px">${PROV[p.pid].caps.map(c=>`<span class="pill">${CAPN[c]}</span>`).join('')}</div>${PROV[p.pid].vpn?`<p class="sub" style="margin-bottom:12px">Gemini needs a VPN in Hong Kong. Turn it on before you connect, or the test will time out.</p>`:''}<button class="btn ghost" data-remove="${p.id}">Remove provider</button></div></div>`}).join('')}`}
function voices(){
  if(S.vstate==='loading')return `<h2>Voices</h2><div class="vgrid">${'<div class="skel"></div>'.repeat(6)}</div>`;
  if(S.vstate==='error')return `<h2>Voices</h2><div class="warn" style="margin-top:16px">${ic('warn')}<div><b>Couldn't load MiniMax voices.</b><span>MiniMax didn't answer. Check the key in Providers, or try again in a moment.</span><div class="acts"><button class="btn out" data-vs="ok">Try again</button><button class="btn" data-tab="providers">Open Providers</button></div></div></div>`;
  return `<b>Preview line</b><div class="row" style="margin:8px 0 16px"><input id="pl" value="${S.preview}"><button class="btn out" data-all>Play all</button></div>
  <div class="row"><div class="chips"><span class="chip on">All ${S.voices.length}</span>${['minimax','gemini'].map(p=>`<span class="chip">${logo(p,1)}${PROV[p].n}</span>`).join('')}</div><span class="sp"></span><button class="btn" data-newv>New voice preset</button></div>
  <div class="vgrid">${S.voices.map(v=>`<div class="card voice ${S.playing===v.id?'play':''} ${v.gone?'gone':''}" ${v.gone?'data-gone':''}><div class="top"><button class="pbtn" data-play="${v.id}">${ic(S.playing===v.id?'stop':'play')}</button><div class="sp"><b>${v.n}</b><div class="sub row" style="gap:6px">${logo(v.prov,1)}${v.meta}</div></div><span>${ic('more')}</span></div>
   <div class="wave">${Array.from({length:30},(_, i)=>`<i style="animation-delay:${i*60}ms"></i>`).join('')}</div>
   ${v.gone?`<div style="color:var(--warn);font-size:12px;display:flex;gap:6px">${ic('warn')}Clone removed after 7 idle days. Playing Warm host instead.</div>`:v.tag?`<span class="pill">${v.tag}</span>`:''}</div>`).join('')}
   <div class="new" data-newv><div style="text-align:center"><div class="pbtn" style="margin:0 auto 8px;background:var(--primary);color:#fff">${ic('plus','m')}</div>New voice preset</div></div></div>
  <p class="foot">Every play uses a little of that provider's quota.</p>
  <p class="foot" style="margin-top:8px"><button class="btn" data-vs="loading">Show loading</button> <button class="btn" data-vs="error">Show error</button></p>`}
function sessions(){return `<div class="row" style="margin-bottom:16px"><div><h2>Who your AI pretends to be</h2><p class="sub">A session is a saved system prompt. Characters and behaviours pick one.</p></div><span class="sp"></span><button class="btn" data-news>New session</button></div><div class="grid3">${S.sessions.map(s=>`<div class="card voice"><div class="top"><div class="tile p">${ic('chat','m')}</div><div class="sp"><b>${s.n}</b><div class="sub">${s.u}</div></div>${ic('more')}</div><div style="background:#121212;border-radius:6px;padding:10px;font-size:12px;color:var(--text-2)">${s.p}</div></div>`).join('')}<div class="new" data-news><div style="text-align:center"><div class="pbtn" style="margin:0 auto 8px;background:var(--primary);color:#fff">${ic('plus','m')}</div>New session</div></div></div>`}
/* Dialogs */
function dlg(title,body,foot){show(`<div class="dlg"><div class="h"><h3>${title}</h3><button class="tb" data-back>${ic('close')}</button></div><div class="b">${body}</div><div class="f">${foot}</div></div>`)}
let addSel='gemini',addKey='k1';
function addDlg(){
  const p=PROV[addSel];const keys=S.keys.filter(k=>k.prov===addSel);
  dlg('Add a provider',`<p style="margin-bottom:12px">Pick a provider and a saved key. We'll test it right away.</p><b>Pick a provider</b><div class="ptiles">${Object.entries(PROV).map(([id,v])=>`<button class="pt ${addSel===id?'on':''}" data-sel="${id}">${logo(id)}${v.n}<span class="cap">${v.caps.slice(0,3).map(c=>ic(c)).join('')}${v.caps.length>3?'+'+(v.caps.length-3):''}</span></button>`).join('')}</div><p class="sub" style="margin-bottom:16px">${p.n}: ${p.caps.map(c=>CAPN[c]).join(', ')}.</p>
  ${addSel==='custom'?`<div class="field"><label>Name</label><input value="Studio server"></div><div class="field"><label>Server address</label><input value="http://192.168.1.20:8080/v1"></div><details><summary>Advanced</summary><div class="field" style="margin-top:12px"><label>Request format</label><select><option>OpenAI compatible</option><option>Custom JSON</option></select></div><div class="field"><label>Timeout (seconds)</label><input value="30"></div></details>`:''}
  <div class="field"><label>API key</label><div class="row"><select id="keysel">${keys.length?keys.map(k=>`<option value="${k.id}" ${k.id===addKey?'selected':''}>${k.name}${k.locked?' (locked)':''}</option>`).join(''):'<option value="">No key yet</option>'}</select><button class="btn out" data-addkey>${keys.length?'Manage keys':'Add a key'}</button></div></div>
  ${p.vpn?`<div class="warn">${ic('world')}<div><b>Gemini needs a VPN in Hong Kong</b><span>Turn it on before you connect, or the test will time out.</span></div></div>`:''}`,
  `<button class="btn out" data-back>Cancel</button><button class="btn pri" data-connect ${keys.length?'':'disabled'}>Connect ${p.n}</button>`)}
function keyDlg(){dlg('Add key',`<div class="field"><label>Name</label><input id="kn" placeholder="Office Key"></div><div class="field"><label>Provider</label><select id="kp">${Object.entries(PROV).map(([i,v])=>`<option value="${i}" ${i===addSel?'selected':''}>${v.n}</option>`).join('')}</select></div><div class="field"><label>API key</label><input id="kv" type="password" placeholder="Paste your key"></div><div class="field"><label>Password (optional)</label><input id="kpw" type="password" placeholder="Lock this key with a password"></div><p class="sub">Keys are encrypted and kept on this computer. Projects never contain them, and VOTANIC never sees them.</p>`,`<button class="btn out" data-back>Cancel</button><button class="btn pri" data-savekey>Save key</button>`)}
function chooseTask(id){const t=TASKS.find(x=>x.id===id);const opts=S.providers;
  dlg(t.n,`<p class="sub" style="margin-bottom:12px">Who should do this task?</p>${opts.length?opts.map(p=>{const ok=PROV[p.pid].caps.includes(t.cap);const pdfBad=id==='quiz'&&!PROV[p.pid].pdf;return `<div class="pick" style="margin-bottom:8px;${ok&&!pdfBad?'':'opacity:.5;cursor:not-allowed'}" ${ok&&!pdfBad?`data-set="${id}|${p.id}"`:''}>${logo(p.pid)}<div class="sp"><b>${PROV[p.pid].n}</b><div class="sub">${!ok?`Doesn't do ${CAPN[t.cap]}`:pdfBad?"Can't read PDFs, so quizzes can't use it":PROV[p.pid].model}</div></div>${lockedKey(p)?'<span class="pill lock">Locked</span>':''}</div>`}).join(''):'<p>Add a provider first.</p>'}`,`<button class="btn out" data-back>Close</button>`)}
function removeDlg(id){const p=prov(id);dlg(`Remove ${PROV[p.pid].n}?`,`<p>Text to speech and Text to music will stop until you pick another provider.</p>`,`<button class="btn out" data-back>Cancel</button><button class="btn des" data-rm="${id}">Remove ${PROV[p.pid].n}</button>`)}
function unlockDlg(id,err){const p=prov(id);dlg('Unlock key',`<p style="margin-bottom:12px">Enter the password for ${S.keys.find(k=>k.id===p.key).name}.</p><div class="field"><input id="pw" type="password" placeholder="Password">${err?`<span class="err-t">That password doesn't match. Check Caps Lock and try again.</span>`:''}</div><p class="sub">Hint: the prototype password is "xrcc".</p>`,`<button class="btn out" data-back>Cancel</button><button class="btn pri" data-doun="${id}">Unlock</button>`)}
function newVoice(){dlg('New voice preset',`<div class="field"><label>Name</label><input placeholder="Auntie Mei"></div><label style="font-size:12px;font-weight:600">Voice from</label><div class="chips" style="margin:6px 0 16px">${['minimax','gemini'].map((p,i)=>`<span class="chip ${i?'':'on'}">${logo(p,1)}${PROV[p].n}</span>`).join('')}</div><div class="picks">${['Lyrical|Calm, mid pitch','Newsreader|Clear, steady','Auntie Mei|Warm, chatty','Young explorer|Bright, quick'].map((v,i)=>{const [a,b]=v.split('|');return `<div class="pick ${i===0?'on':''}"><span class="pbtn" style="width:32px;height:32px">${ic('play')}</span><div><b>${a}</b><div class="sub">${b}</div></div></div>`}).join('')}</div><details><summary>Advanced</summary><p class="sub" style="margin-top:8px">Speed 1.0 · Pitch 0 · Emotion neutral</p></details>`,`<button class="btn out" data-back>Cancel</button><button class="btn pri" data-savev>Save preset</button>`)}
function settings(){show(`<div class="panel"><div class="set"><div class="nav"><h4>Settings</h4>${['Display','Control','Edit','Networking','Sketchfab','Security and Privacy','Licensing'].map(x=>`<div>${x}</div>`).join('')}<div class="on">Connections</div></div><div style="padding:24px 32px;overflow:auto"><div class="row"><h2>Connections</h2><span class="sp"></span><button class="tb" data-x>${ic('close')}</button></div><p class="sub" style="margin:4px 0 24px">Keys are encrypted and kept on this computer. Projects never contain them, and VOTANIC never sees them.</p><div class="row" style="margin-bottom:12px"><div><b style="font-size:16px">AI keys</b><div class="sub">Used by AI providers in every project on this computer.</div></div><span class="sp"></span><button class="btn pri" data-addkey2>Add key</button></div>${S.keys.map(k=>`<div class="keyrow">${logo(k.prov)}<div class="t"><b>${k.name}</b><span>${k.meta}</span></div><span class="prot ${k.pw?'':'n'}">${ic(k.pw?'lock':'key')}${k.pw?'Password set':'No password'}</span>${ic('more')}</div>`).join('')}</div></div></div>`)}
/* Events */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-x],[data-back],[data-tab],[data-add],[data-sel],[data-connect],[data-task],[data-set],[data-prov],[data-test],[data-unlock],[data-doun],[data-remove],[data-rm],[data-play],[data-all],[data-vs],[data-newv],[data-savev],[data-gone],[data-addkey],[data-addkey2],[data-savekey],[data-news],#openAI,#openSettings,#reset');
  if(!t)return;const d=t.dataset;
  if(t.id==='openAI')return openPanel();
  if(t.id==='openSettings')return settings();
  if(t.id==='reset'){S=init();hide();return toast('Prototype reset')}
  if('x' in d)return hide();
  if('back' in d)return S.settingsOpen?settings():(S.tab==='first'&&!S.providers.length?renderPanel():renderPanel());
  if(d.tab){S.tab=d.tab;return renderPanel()}
  if('add' in d){addSel='gemini';addKey='k1';return addDlg()}
  if(d.sel){addSel=d.sel;const k=S.keys.find(k=>k.prov===addSel);addKey=k?k.id:'';return addDlg()}
  if('addkey' in d||'addkey2' in d){S.settingsOpen='addkey2' in d;return keyDlg()}
  if('savekey' in d){const n=$('#kn').value||'New key',p=$('#kp').value,pw=$('#kpw').value;S.keys.push({id:'k'+Date.now(),name:n,prov:p,meta:PROV[p].n+' · added today',pw:!!pw});toast('Key saved');if(S.settingsOpen)return settings();addSel=p;addKey=S.keys[S.keys.length-1].id;return addDlg()}
  if('connect' in d){const sel=$('#keysel');const kid=sel&&sel.value;if(!kid)return;const exist=S.providers.find(p=>p.pid===addSel);if(!exist)S.providers.push({id:'p'+Date.now(),pid:addSel,key:kid});S.tab='providers';toast(PROV[addSel].n+' connected');return renderPanel()}
  if(d.task)return chooseTask(d.task);
  if(d.set){const [tid,pid]=d.set.split('|');S.assign[tid]=pid;S.tab='tasks';return renderPanel()}
  if(d.test){const p=prov(d.test);toast('Testing '+PROV[p.pid].n+'…');setTimeout(()=>{p.status=PROV[p.pid].vpn&&p.status!=='failed'?'failed':'';renderPanel();toast(p.status?'Test timed out':'Connected')},900);return}
  if(d.unlock)return unlockDlg(d.unlock);
  if(d.doun){const v=$('#pw').value;if(v==='xrcc'){const p=prov(d.doun);S.keys.find(k=>k.id===p.key).locked=false;toast('Key unlocked');return renderPanel()}return unlockDlg(d.doun,true)}
  if(d.remove)return removeDlg(d.remove);
  if(d.rm){S.providers=S.providers.filter(p=>p.id!==d.rm);Object.keys(S.assign).forEach(k=>{if(S.assign[k]===d.rm)delete S.assign[k]});if(!S.providers.length)S.tab='first';return renderPanel()}
  if(d.prov&&!e.target.closest('button')){S.open=S.open===d.prov?null:d.prov;return renderPanel()}
  if(d.play){const v=S.voices.find(v=>v.id===d.play);S.playing=S.playing===v.id?null:v.id;renderPanel();if(S.playing)setTimeout(()=>{if(S.playing===v.id){S.playing=null;renderPanel()}},4000);return}
  if('all' in d){toast('Playing each voice with the same line');return}
  if(d.vs){S.vstate=d.vs;if(d.vs==='loading')setTimeout(()=>{S.vstate='ok';renderPanel()},1500);return renderPanel()}
  if('gone' in d)return;
  if('newv' in d)return newVoice();
  if('savev' in d){S.voices.push({id:'v'+Date.now(),n:'New preset',prov:'minimax',meta:'Cantonese'});S.tab='voices';return renderPanel()}
  if('news' in d){S.sessions.push({n:'New session',u:'Not used yet',p:'“Write the character prompt here.”'});S.tab='sessions';return renderPanel()}
});
ov.addEventListener('mousedown',e=>{if(e.target===ov)hide()});
</script>
</body>
</html>
